name: Demande de fonctionnalité
description: Proposer une fonctionnalité ou une amélioration
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Besoin
      description: Quel problème cela résout-il, pour qui ?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposition
      description: Ce que Vulnizard devrait faire.
  - type: dropdown
    id: area
    attributes:
      label: Domaine
      options: [Interface, Sources de vulnérabilités, Inventaire / connecteurs, Notifications, Identité et droits, MCP / API, Déploiement, Autre]
