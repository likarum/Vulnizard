[package]
name = "vulnizard"
version = "0.2.3"
edition = "2021"
default-run = "vulnizard"
description = "Lightweight Vulnerability Intelligence Platform"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
rusqlite = { version = "0.32", features = ["bundled", "functions"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "gzip", "blocking"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utils
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
flate2 = "1"
csv = "1"
regex = "1"
zip = "2"
indicatif = "0.17"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "form", "json"] }
maud = { version = "0.27.0", features = ["axum"] }
argon2 = "0.5"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4.3"
rand = "0.8"
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "native-tls", "hostname"] }
percent-encoding = "2.3.2"
rpassword = "7.5.5"
url = "2.5.8"
tar = "0.4.46"
p256 = { version = "0.13", features = ["ecdsa"] }
glob = "0.3.4"
webauthn-rs = { version = "0.6.2", features = ["danger-allow-state-serialisation", "conditional-ui"] }
hmac = "0.12"
sha1 = "0.10"
uuid = { version = "1", features = ["v4"] }
qrcode = { version = "0.15.0", default-features = false, features = ["svg"] }
chacha20poly1305 = "0.10"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5.3", features = ["util"] }
webauthn-authenticator-rs = { version = "0.6.2", default-features = false, features = ["softpasskey"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
